name: Sync upstream

on:
  schedule:
    # 03:17 Asia/Ho_Chi_Minh = 20:17 UTC hôm trước
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          FORK_BRANCH="${{ github.event.repository.default_branch }}"
          UPSTREAM=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.full_name')
          if [ -z "$UPSTREAM" ] || [ "$UPSTREAM" = "null" ]; then
            echo "No parent repository found for $GITHUB_REPOSITORY. Skipping."
            exit 0
          fi

          echo "Configuring upstream remote: $UPSTREAM..."
          git remote add upstream "https://github.com/$UPSTREAM.git" || true

          UPSTREAM_BRANCH=$(gh api "repos/$UPSTREAM" --jq '.default_branch // "main"')
          echo "Fetching upstream/$UPSTREAM_BRANCH..."
          git fetch upstream "$UPSTREAM_BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # MERGE-THẲNG-MAIN: luôn merge upstream vào FORK_BRANCH.
          PRE_MERGE=$(git rev-parse HEAD)
          if ! git merge "upstream/$UPSTREAM_BRANCH" --no-edit -X ours; then
            git diff --name-only --diff-filter=U | while read f; do
              git checkout "$PRE_MERGE" -- "$f" 2>/dev/null || rm -f "$f"
              git add "$f" 2>/dev/null || true
            done
            git commit --no-edit --no-verify || true
          fi
          # Preserve .github/workflows/ về pre-merge state (GITHUB_TOKEN restriction — xem comment đầu template)
          git rm -r -q --ignore-unmatch .github/workflows 2>/dev/null || true
          git checkout "$PRE_MERGE" -- .github/workflows 2>/dev/null || true
          git add .github/workflows 2>/dev/null || true
          git diff --cached --quiet HEAD || git commit -m "chore: preserve fork workflows (pre-merge state)" --no-verify || true
          git push origin "$FORK_BRANCH"
          echo "Sync completed: $FORK_BRANCH merged with upstream/$UPSTREAM_BRANCH."
          echo "All done."
