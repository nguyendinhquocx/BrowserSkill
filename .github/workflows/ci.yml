name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust fmt, clippy, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            !target/windows-daemon-validation
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-rust-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

  windows-daemon:
    name: Windows daemon, installer and cancellation regression tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Run Windows named-pipe tests
        run: cargo test -p bsk --lib --locked daemon::ipc::windows::tests

      - name: Run Windows audit storage tests
        run: cargo test -p bsk --lib --locked daemon::audit::tests

      - name: Run Windows audit and browser interaction policy tests
        run: cargo test -p bsk --test audit_ws --test interaction_preferences --locked

      - name: Run Windows process liveness tests
        run: cargo test -p bsk --lib --locked daemon::lockfile::tests

      - name: Run Windows update tests
        run: cargo test -p bsk --lib --locked cli::update::tests

      - name: Run Windows update and cancellation process tests
        run: cargo test -p bsk --test windows_update --test windows_parent_cancel --locked

      - name: Run installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/install-windows.test.ps1

      - name: Run installer tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/install-windows.test.ps1

  frontend:
    name: Frontend lint, typecheck, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify generated protocol against current Rust sources
        run: pnpm protocol:check

      - name: Prepare extension types
        run: pnpm --filter @browser-skill/extension exec wxt prepare

      - name: Run lint checks
        run: pnpm lint

      - name: Compile extension TypeScript
        run: pnpm --filter @browser-skill/extension compile

      - name: Run localization tests
        run: pnpm --filter @browser-skill/i18n test

      - name: Run VOM tests
        run: pnpm --filter @browser-skill/vom test

      - name: Typecheck, test, and verify DSH plugin package
        run: >-
          pnpm --filter @wxg-prc-cpg/browser-skill-dsh-plugin typecheck &&
          pnpm --filter @wxg-prc-cpg/browser-skill-dsh-plugin test &&
          node scripts/check-dsh-package.mjs

      - name: Run extension unit tests
        run: pnpm ext:test

      - name: Validate browser evaluation corpus and harness tests
        run: pnpm eval:browser:check

      - name: Build extension
        run: pnpm ext:build

  browser-input:
    name: Browser input readiness regression
    runs-on: ubuntu-latest
    env:
      BSK_TEST_CHROME: google-chrome

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare extension types
        run: pnpm --filter @browser-skill/extension exec wxt prepare

      - name: Run browser input readiness regression
        env:
          BSK_CLICK_CHROME: google-chrome
        run: pnpm --filter @browser-skill/extension exec vitest run src/tools/__tests__/click.browser.test.ts

  node-scripts:
    name: Node script tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run script tests
        run: node --test scripts/*.test.mjs
